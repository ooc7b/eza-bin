name: release

on:
  workflow_dispatch:
    inputs:
      eza_tag:
        description: "eza tag to build (e.g. v0.23.5)"
        required: true
        type: string

permissions:
  contents: read

env:
  EZA_REPOSITORY: eza-community/eza
  EZA_BINARY: eza

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            use-cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
    steps:
      - name: Checkout eza at ${{ inputs.eza_tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.EZA_REPOSITORY }}
          ref: ${{ inputs.eza_tag }}
          path: eza
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@cross

      - name: Build with cross
        if: matrix.use-cross
        working-directory: eza
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build natively
        if: ${{ !matrix.use-cross }}
        working-directory: eza
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        working-directory: eza
        shell: bash
        run: |
          set -euo pipefail
          staging="${EZA_BINARY}_${{ matrix.target }}"
          mkdir -p "dist/$staging/completions"
          cp "target/${{ matrix.target }}/release/${EZA_BINARY}" "dist/$staging/"
          cp LICENSE.txt README.md "dist/$staging/"
          cp -R completions/. "dist/$staging/completions/"
          tar -czf "dist/$staging.tar.gz" -C dist "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EZA_BINARY }}-${{ matrix.target }}
          path: eza/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: release ${{ inputs.eza_tag }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.eza_tag }}
          name: ${{ env.EZA_BINARY }} ${{ inputs.eza_tag }}
          body: |
            Binaries built from [${{ env.EZA_REPOSITORY }}@${{ inputs.eza_tag }}](https://github.com/${{ env.EZA_REPOSITORY }}/releases/tag/${{ inputs.eza_tag }}).

            Built with the default `git` feature enabled.
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
